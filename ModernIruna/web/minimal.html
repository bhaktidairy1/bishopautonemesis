<!DOCTYPE html>
<html>
<head>
    <title>Iruna Minimal Mode</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 5px 10px; cursor: pointer; }
        button:hover { background: #0f0; color: #000; }
        input { width: 100%; max-width: 600px; padding: 5px; background: #111; color: #0f0; border: 1px solid #0f0; margin-bottom: 10px; }
        .section { border: 1px solid #0f0; padding: 10px; margin-bottom: 20px; max-width: 600px; }
    </style>
</head>
<body>
    <h1>Zimov Auto-Farmer (Minimal)</h1>
    <div id="login-section" class="section">
        <h3>0. Authentication</h3>
        <p>Paste your Mage URL below to connect and auto-start the Zimov loop.</p>
        <input type="text" id="auth-url" placeholder="https://gae4php82-real.an.r.appspot.com/...">
        <button style="background: #0f0; color: #000; border-color: #0f0; padding: 10px 20px; font-weight: bold;" onclick="connectBot()">CONNECT & START</button>
    </div>

    <div id="status-section" class="section" style="display: none;">
        <h3>1. Status & Stats</h3>
        <p>Connection: <strong id="conn-status">Checking...</strong> <button style="background: #222; color: #f00; border-color: #f00; margin-left: 10px;" onclick="disconnectBot()">DISCONNECT</button></p>
        <p>Loop Status: <strong id="auto-status">Unknown</strong></p>
        <p>Map: <span id="map-name">Unknown</span></p>
        <p>Total Runs (7x+Heal): <span id="run-count">0</span></p>
        <p>Total Boss Kills: <span id="kill-count">0</span></p>
        <p>Total Spina Earned: <span id="spina-earned">0</span></p>
    </div>

    <div class="section">
        <h3>2. Inventory</h3>
        <ul id="inventory-list"></ul>
    </div>

    <div class="section" id="terminal-section" style="display: none; height: 300px; overflow-y: auto; background: #111; padding: 10px; border: 1px solid #0f0;">
        <h3>3. Data Stream</h3>
        <div id="terminal" style="font-size: 0.85em; white-space: pre-wrap; word-break: break-all;"></div>
    </div>

    <script>
        let pollInterval;
        let logPollInterval;
        let isConnected = false;

        function connectBot() {
            const url = document.getElementById("auth-url").value;
            if(!url) return alert("Please enter a URL");
            
            fetch('/api/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            document.getElementById("login-section").style.display = "none";
            document.getElementById("status-section").style.display = "block";
            document.getElementById("terminal-section").style.display = "block";
            
            pollInterval = setInterval(fetchState, 1000);
            logPollInterval = setInterval(fetchLogs, 1000);
        }

        function disconnectBot() {
            fetch("/api/disconnect", { method: "POST" })
            .then(() => {
                clearInterval(pollInterval);
                clearInterval(logPollInterval);
                isConnected = false;
                document.getElementById("login-section").style.display = "block";
                document.getElementById("status-section").style.display = "none";
                document.getElementById("terminal-section").style.display = "none";
                document.getElementById('conn-status').innerText = 'Disconnected';
            });
        }

        function fetchState() {
            fetch('/api/state').then(r=>r.json()).then(data => {
                if (data.connected && !isConnected) {
                    isConnected = true;
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("status-section").style.display = "block";
                    document.getElementById("terminal-section").style.display = "block";
                    
                    if (!pollInterval) pollInterval = setInterval(fetchState, 1000);
                    if (!logPollInterval) logPollInterval = setInterval(fetchLogs, 1000);
                }
                
                document.getElementById('conn-status').innerText = data.connected ? 'Connected' : 'Disconnected';
                document.getElementById('auto-status').innerText = data.auto_zimov_running ? 'Running' : 'Stopped';
                document.getElementById('run-count').innerText = data.auto_zimov_run_count || 0;
                document.getElementById('kill-count').innerText = data.auto_zimov_kill_count || 0;
                document.getElementById('spina-earned').innerText = data.spina_earned ? data.spina_earned.toLocaleString() : 0;
                document.getElementById('map-name').innerText = data.map_name || 'Unknown';
                
                let invHtml = '';
                if(data.inventory) {
                    let sorted = Object.values(data.inventory).sort((a,b) => b.count - a.count);
                    for(let item of sorted) {
                        invHtml += '<li>' + item.name + ': ' + item.count + '</li>';
                    }
                }
                document.getElementById('inventory-list').innerHTML = invHtml;
            }).catch(e => console.log('State fetch failed', e));
        }

        function fetchLogs() {
            fetch("/api/logs").then(r => r.json()).then(data => {
                if (data.logs && data.logs.length > 0) {
                    const terminal = document.getElementById("terminal");
                    let isScrolledToBottom = (terminal.parentElement.scrollHeight - terminal.parentElement.clientHeight <= terminal.parentElement.scrollTop + 1);
                    
                    data.logs.forEach(log => {
                        let span = document.createElement("span");
                        span.textContent = log + "\\n";
                        if (log.includes("<-")) span.style.color = "#0f0";
                        else if (log.includes("->")) span.style.color = "#ff0";
                        else if (log.includes("[!]")) span.style.color = "#f00";
                        terminal.appendChild(span);
                    });

                    while (terminal.childNodes.length > 500) {
                        terminal.removeChild(terminal.firstChild);
                    }
                    if (isScrolledToBottom) {
                        terminal.parentElement.scrollTop = terminal.parentElement.scrollHeight;
                    }
                }
            }).catch(e => console.log('Log fetch failed', e));
        }

        // Start polling state in case we refresh while already connected
        fetchState();
    </script>
</body>
</html>
